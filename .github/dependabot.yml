version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint supports TypeScript only up to 6.0; lint is type-aware.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The types follow the oldest supported runtime (.nvmrc, engines): Node 22.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
