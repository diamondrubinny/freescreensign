name: Release

# "Run workflow" with "publish" checked builds everything, publishes signed images to GHCR
# and creates a DRAFT GitHub release (tag v<version> on the built commit) with the
# installers, SBOMs and checksums. A maintainer reviews the draft and publishes it by hand;
# publishing creates the tag. "Run workflow" without "publish" is a dry run: it builds and
# checks everything and publishes nothing.
#
# Deliberately no trigger on tag pushes: publishing a draft creates its tag, and a second
# run would rebuild and re-push that version's images (new digests that no longer match the
# release's images.txt) and open a duplicate draft.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish: images to GHCR and a draft release (otherwise a dry run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ inputs.publish == true }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}/rubinny

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check the version
        id: version
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          for file in apps/*/package.json packages/*/package.json; do
            [ "$(node -p "require('./$file').version")" = "$version" ] || { echo "$file is not $version"; exit 1; }
          done
          grep -q "versionName = \"$version\"" apps/android/app/build.gradle.kts || { echo "Android versionName is not $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: Images (scan, SBOM, publish and sign)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Sigstore) with the workflow's identity
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Trivy and cosign
        # Built from source at fixed versions; the Go checksum database verifies the code.
        # Retried: the checksum database has had passing network errors (each retry still verifies).
        run: |
          go_install() { for attempt in 1 2 3; do go install "$1" && return 0; echo "go install $1 failed (attempt $attempt)"; sleep 20; done; return 1; }
          go_install github.com/aquasecurity/trivy/cmd/trivy@v0.75.0
          go_install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build (amd64 and arm64)
        # Each architecture is loaded and checked on its own; the publish step below reuses
        # the build cache to push both as one multi-architecture image.
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load -f apps/server/Dockerfile --target server -t "rubinny/server:$VERSION-$arch" .
            docker buildx build --platform "linux/$arch" --load -f apps/server/Dockerfile --target worker -t "rubinny/worker:$VERSION-$arch" .
            docker buildx build --platform "linux/$arch" --load -f apps/cms/Dockerfile -t "rubinny/web:$VERSION-$arch" .
          done
      - name: Scan (fail on fixable HIGH/CRITICAL)
        run: |
          for arch in amd64 arm64; do
            for image in server worker web; do
              trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
                --ignorefile .trivyignore.yaml "rubinny/$image:$VERSION-$arch"
            done
          done
      - name: SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          for arch in amd64 arm64; do
            for image in server worker web; do
              trivy image --skip-db-update --format cyclonedx \
                -o "sbom/rubinny-$image-$VERSION-$arch.cdx.json" "rubinny/$image:$VERSION-$arch"
            done
          done
          trivy fs --skip-db-update --format cyclonedx --include-dev-deps --skip-dirs node_modules \
            -o "sbom/rubinny-source-$VERSION.cdx.json" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 14
          if-no-files-found: error
      - name: Publish to GHCR and sign
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in server worker web; do
            if [ "$target" = web ]; then args=(-f apps/cms/Dockerfile); else args=(-f apps/server/Dockerfile --target "$target"); fi
            docker buildx build "${args[@]}" --platform linux/amd64,linux/arm64 --push \
              --provenance=mode=max --sbom=true \
              --metadata-file "meta-$target.json" -t "$REGISTRY/$target:$VERSION" .
            digest="$(node -p "require('./meta-$target.json')['containerimage.digest']")"
            # The multi-architecture index and each architecture's image are signed.
            cosign sign --yes --recursive "$REGISTRY/$target@$digest"
            echo "$REGISTRY/$target:$VERSION@$digest" >> images.txt
          done
          cat images.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: images
          path: images.txt
          retention-days: 14

  desktop:
    name: Desktop installers (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@rubinny/desktop..."
      - run: pnpm --filter @rubinny/desktop build
      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pnpm exec electron-builder --win nsis --publish never
          else pnpm exec electron-builder --linux AppImage deb --publish never; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
          retention-days: 14
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the Gradle wrapper
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/rubinny-player-android-${{ needs.version.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, images, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the files
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -D artifacts
          mkdir dist
          find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.apk' -o -name '*.cdx.json' -o -name images.txt \) \
            -exec cp {} dist/ \;
          cp deploy/kiosk/raspberry-pi/install.sh "dist/rubinny-raspberry-pi-install-$VERSION.sh"
          git archive --format=tar.gz --prefix="rubinny-$VERSION/" -o "dist/rubinny-deploy-$VERSION.tar.gz" HEAD deploy docs LICENSE NOTICE
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist
          # Release notes: this version's section of the changelog.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create the draft release
        if: env.PUBLISH == 'true'
        run: |
          gh release create "v$VERSION" dist/* -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Rubinny $VERSION" --notes-file notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH != 'true'
        with:
          name: release-dry-run
          path: dist/
          retention-days: 7
