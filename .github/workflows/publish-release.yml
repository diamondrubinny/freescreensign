name: Publish release

# "Run workflow" publishes a draft release made by release.yml, as the latest release, and/or
# removes obsolete drafts. Only people with write access can run it, and only on the default
# branch. It refuses anything that is not a draft, and a draft whose title is not
# "Rubinny <version>". Publishing creates the tag on the commit the draft was built from.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: a draft to publish (e.g. v0.7.0)'
        required: false
        type: string
      remove_draft:
        description: 'Optional: obsolete drafts to delete, separated by spaces (e.g. v0.3.0 v0.4.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      REMOVE: ${{ inputs.remove_draft }}
    steps:
      - name: Check the inputs
        run: |
          [ -n "$TAG$REMOVE" ] || { echo "Nothing to do: give a tag to publish or drafts to delete"; exit 1; }
          is_tag() { printf '%s' "$1" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; }
          [ -z "$TAG" ] || is_tag "$TAG" || { echo "Not a release tag: $TAG"; exit 1; }
          # $REMOVE is split on spaces on purpose (no globbing); each word must be a release tag.
          set -f
          for value in $REMOVE; do
            is_tag "$value" || { echo "Not a release tag: $value"; exit 1; }
            [ "$value" != "$TAG" ] || { echo "The same tag to publish and to delete"; exit 1; }
          done
      - name: Publish the draft and delete obsolete drafts
        run: |
          # Drafts have no tag yet, so look them up in the list of releases.
          release() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$1\") | {id, draft, name}"
          }
          if [ -n "$TAG" ]; then
            found="$(release "$TAG")"
            if [ -z "$found" ]; then
              echo "No release $TAG. Releases this token sees:"
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[] | "  \(.tag_name) draft=\(.draft) \(.name)"'
              exit 1
            fi
            [ "$(echo "$found" | jq -r .draft)" = true ] || { echo "$TAG is not a draft"; exit 1; }
            [ "$(echo "$found" | jq -r .name)" = "Rubinny ${TAG#v}" ] \
              || { echo "$TAG was not made by release.yml"; exit 1; }
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$(echo "$found" | jq -r .id)" \
              -F draft=false -f make_latest=true --jq '"Published: " + .html_url'
          fi
          # Only drafts are deleted; a published release stops the run before anything else goes.
          set -f
          for old_tag in $REMOVE; do
            old="$(release "$old_tag")"
            [ -n "$old" ] || { echo "No release $old_tag (nothing to delete)"; continue; }
            [ "$(echo "$old" | jq -r .draft)" = true ] \
              || { echo "$old_tag is published; not deleting it"; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$(echo "$old" | jq -r .id)"
            echo "Deleted the draft $old_tag"
          done
