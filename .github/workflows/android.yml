name: Android

on:
  push:
    branches: [main, claude/sharp-volta-n0yetk]
    paths:
      - 'apps/android/**'
      - 'apps/player/src/native.ts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/player/src/native.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app (lint, unit tests, APK, emulator tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    env:
      API_LEVEL: '34'
      SYSTEM_IMAGE: 'system-images;android-34;google_apis;x86_64'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the Gradle wrapper
        # The official wrapper JAR (gradle.org/release-checksums); the distribution itself is
        # pinned by distributionSha256Sum in gradle-wrapper.properties.
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up JDK and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Lint, unit tests, build
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Show the lint report
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rubinny-player-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Start an emulator
        run: |
          # Hardware acceleration for the emulator (KVM) on GitHub's Linux runners.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The emulator's QEMU links the PulseAudio client library, even with -no-audio.
          sudo apt-get install -y -q libpulse0 > /dev/null
          # avdmanager and the emulator must look for the AVD in the same folder.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --install emulator platform-tools "$SYSTEM_IMAGE" | grep -v '^\[' || true
          ls "$ANDROID_HOME/system-images/android-$API_LEVEL/google_apis/x86_64/system.img"
          emulator -version | head -1
          emulator -accel-check
          echo no | avdmanager create avd --force --name ci --package "$SYSTEM_IMAGE" --device pixel_6
          nohup emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          # Wait for the boot, but stop at once if the emulator process died.
          for i in $(seq 1 200); do
            kill -0 "$(cat "$RUNNER_TEMP/emulator.pid")" || { echo "emulator exited"; exit 1; }
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 3
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82

      - name: Emulator log
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/emulator.log" || true

      - name: Device tests (real WebView, screenshots, guards, crash recovery)
        run: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            ${{ runner.temp }}/emulator.log
          retention-days: 7
          if-no-files-found: ignore
