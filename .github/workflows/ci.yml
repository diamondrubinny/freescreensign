name: CI

on:
  push:
    # The default branch of this repository, plus main for forks and a future rename.
    branches: [main, claude/sharp-volta-n0yetk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rubinny
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rubinny
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rubinny" --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (media processing tests)
        # A stalled package mirror once used up the whole job: retry, and give up on a stall.
        timeout-minutes: 8
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends ffmpeg
      - name: Start object storage and ClamAV (media integration tests)
        run: |
          docker run -d --name ci-s3 -p 8333:8333 \
            -e S3_ACCESS_KEY_ID=cikey -e S3_SECRET_ACCESS_KEY=ci-only-secret-0123456789 \
            -v "$PWD/deploy/seaweedfs/entrypoint.sh:/rubinny/entrypoint.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.48 /rubinny/entrypoint.sh
          docker run -d --name ci-clamav -p 3310:3310 \
            -e CLAMD_CONF_StreamMaxLength=1024M clamav/clamav:stable
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Wait for ClamAV signatures
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ci-clamav)" = healthy ] && exit 0
            sleep 5
          done
          docker logs ci-clamav | tail -20
          exit 1
      - run: pnpm test
        env:
          RUBINNY_INTEGRATION: '1'
          RUBINNY_MEDIA_INTEGRATION: '1'
          DATABASE_URL: postgres://rubinny:ci-only-password@localhost:5432/rubinny
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:8333
          S3_ACCESS_KEY_ID: cikey
          S3_SECRET_ACCESS_KEY: ci-only-secret-0123456789
          CLAMAV_HOST: localhost
          CLAMAV_PORT: '3310'
      - run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker images (build, vulnerability scan, SBOM) and compose config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: server
          push: false
          load: true
          tags: rubinny/server:ci
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: worker
          push: false
          load: true
          tags: rubinny/worker:ci
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/cms/Dockerfile
          push: false
          load: true
          tags: rubinny/web:ci
      - name: Validate docker compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Install Trivy
        # Built from source at a fixed version; the Go checksum database verifies the code.
        # Retried: the checksum database has had passing network errors (each retry still verifies).
        run: |
          go_install() { for attempt in 1 2 3; do go install "$1" && return 0; echo "go install $1 failed (attempt $attempt)"; sleep 20; done; return 1; }
          go_install github.com/aquasecurity/trivy/cmd/trivy@v0.75.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan the images (fail on fixable HIGH/CRITICAL)
        run: |
          for image in server worker web; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile .trivyignore.yaml "rubinny/$image:ci"
          done
      - name: SBOM of each image (CycloneDX)
        run: |
          mkdir -p sbom
          for image in server worker web; do
            trivy image --skip-db-update --format cyclonedx -o "sbom/rubinny-$image.cdx.json" "rubinny/$image:ci"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-images
          path: sbom/
          retention-days: 30
          if-no-files-found: error

  docker-arm64:
    name: Docker images for arm64 (build and smoke test under emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/arm64)
        run: |
          docker buildx build --platform linux/arm64 --load -f apps/server/Dockerfile --target server -t rubinny/server:arm64 .
          docker buildx build --platform linux/arm64 --load -f apps/server/Dockerfile --target worker -t rubinny/worker:arm64 .
          docker buildx build --platform linux/arm64 --load -f apps/cms/Dockerfile -t rubinny/web:arm64 .
      - name: Smoke test (native modules and tools work on arm64)
        run: |
          docker run --rm --platform linux/arm64 rubinny/server:arm64 node -e "
            Promise.all([import('@node-rs/argon2'), import('sharp')]).then(async ([argon2, sharp]) => {
              if (process.arch !== 'arm64') throw new Error('not arm64: ' + process.arch);
              const hash = await argon2.hash('rubinny');
              if (!(await argon2.verify(hash, 'rubinny'))) throw new Error('argon2');
              const png = await sharp.default({ create: { width: 2, height: 2, channels: 3, background: '#fff' } }).png().toBuffer();
              console.log('server ok', process.arch, png.length, 'bytes');
            }).catch((error) => { console.error(error); process.exit(1); });"
          docker run --rm --platform linux/arm64 --entrypoint ffmpeg rubinny/worker:arm64 -hide_banner -version | head -1
          docker run --rm --platform linux/arm64 --entrypoint caddy rubinny/web:arm64 version

  security:
    name: Secrets and dependency scans, source SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks and Trivy
        # Built from source at fixed versions; the Go checksum database verifies the code.
        # Retried: the checksum database has had passing network errors (each retry still verifies).
        run: |
          go_install() { for attempt in 1 2 3; do go install "$1" && return 0; echo "go install $1 failed (attempt $attempt)"; sleep 20; done; return 1; }
          go_install github.com/zricethezav/gitleaks/v8@v8.30.1
          go_install github.com/aquasecurity/trivy/cmd/trivy@v0.75.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Secrets in the whole git history (gitleaks)
        run: gitleaks git --redact --no-banner .
      - name: Vulnerable dependencies, including development ones (Trivy)
        run: |
          trivy fs --scanners vuln --include-dev-deps --skip-dirs node_modules \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore.yaml .
      - name: SBOM of the source (CycloneDX)
        run: |
          trivy fs --skip-db-update --format cyclonedx --include-dev-deps --skip-dirs node_modules \
            -o sbom-source.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: sbom-source.cdx.json
          retention-days: 30
          if-no-files-found: error

  kiosk:
    name: Shell scripts (kiosk installer, backup)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck deploy/kiosk/raspberry-pi/install.sh deploy/kiosk/raspberry-pi/test/in-container.sh deploy/*.sh deploy/test/*.sh
      - name: Install and uninstall in Debian
        run: docker run --rm -v "$PWD/deploy/kiosk/raspberry-pi:/src:ro" debian:trixie /src/test/in-container.sh
      - name: Verify the systemd unit
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update -q && sudo apt-get $apt_opts install -y -q --no-install-recommends cage
          deploy/kiosk/raspberry-pi/install.sh --url https://signage.example.com --dry-run \
            | awk '/^\[dry-run\] write \/etc\/systemd\/system\/rubinny-kiosk.service/ { f = 1; next }
                   /^\[dry-run\]|==>/ { f = 0 } f' > "$RUNNER_TEMP/rubinny-kiosk.service"
          grep -q '^ExecStart=/usr/bin/cage' "$RUNNER_TEMP/rubinny-kiosk.service"
          systemd-analyze verify "$RUNNER_TEMP/rubinny-kiosk.service"

  desktop:
    name: Desktop app (Electron, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@rubinny/desktop..."
      - run: pnpm --filter @rubinny/desktop build
      - name: End-to-end tests (real Electron)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu restricts unprivileged user namespaces, which Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a pnpm --filter @rubinny/desktop exec playwright test
      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pnpm exec electron-builder --win nsis --publish never
          else pnpm exec electron-builder --linux AppImage deb --publish never; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rubinny-player-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
          retention-days: 7
          if-no-files-found: error

  tv:
    name: TV apps (Samsung Tizen, LG webOS packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@rubinny/tv..."
      - run: pnpm --filter @rubinny/tv build
      - name: Install LG's packaging tool
        run: npm install --global --ignore-scripts @webos-tools/cli@3.2.6
      - name: Package and check
        working-directory: apps/tv
        run: |
          node scripts/package.mjs --require-webos
          version="$(node -p "require('./package.json').version")"
          wgt="release/rubinny-tv-tizen-$version-unsigned.wgt"
          ipk="release/rubinny-tv-webos-$version.ipk"
          for file in config.xml index.html loader.js loader.css icon.png; do
            unzip -l "$wgt" | grep -q " $file\$" || { echo "$file missing from $wgt"; exit 1; }
          done
          unzip -p "$wgt" config.xml | grep -q "version=\"$version\"" || { echo "config.xml version is not $version"; exit 1; }
          ares-package -I "$ipk" | grep -q "\"version\": \"$version\"" || { echo "appinfo.json version is not $version"; exit 1; }
          for file in "$wgt" "$ipk"; do
            [ "$(stat -c %s "$file")" -lt 1000000 ] || { echo "$file is over 1 MB"; exit 1; }
          done
          ls -la release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rubinny-tv
          path: |
            apps/tv/release/*.wgt
            apps/tv/release/*.ipk
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rubinny/cms exec playwright install --with-deps chromium
      - name: Start the stack
        working-directory: deploy
        run: |
          ./generate-env.sh
          sed -i 's/^HSTS_MAX_AGE=.*/HSTS_MAX_AGE=0/' .env
          # All services, including the media worker and ClamAV (signature download can take minutes).
          docker compose up -d --build --wait --wait-timeout 900
      - name: Run Playwright
        run: |
          export E2E_SETUP_TOKEN="$(grep '^SETUP_TOKEN=' deploy/.env | cut -d= -f2)"
          pnpm e2e
      - name: Backup and restore round trip (on the E2E data)
        run: |
          sudo apt-get install -y -q age > /dev/null
          RUBINNY_DESTRUCTIVE_TEST=1 deploy/test/backup-roundtrip.sh
      - name: Dynamic scan (OWASP ZAP baseline, passive)
        run: |
          mkdir -p zap && cp .github/zap/rules.tsv zap/ && chmod -R 777 zap
          # -I: the summary below decides (fails on Medium/High alerts not accepted in rules.tsv).
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.1 \
            zap-baseline.py -t https://localhost/ -c rules.tsv -I -J zap.json -r zap.html
          python3 .github/zap/summary.py zap/zap.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: zap/
          retention-days: 14
          if-no-files-found: ignore
      - name: Server logs
        if: failure()
        working-directory: deploy
        run: docker compose logs server web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/cms/test-results
          retention-days: 7
