<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rubinny Player — הגדרה · Setup</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main>
      <h1>Rubinny Player</h1>
      <p>הזינו את כתובת שרת Rubinny של הארגון.</p>
      <p lang="en" dir="ltr">Enter your organization's Rubinny server address.</p>
      <form id="setup" novalidate>
        <label for="server">כתובת השרת · Server address</label>
        <input
          id="server"
          name="server"
          type="url"
          dir="ltr"
          required
          autocomplete="url"
          placeholder="https://signage.example.com"
          aria-describedby="hint error"
        />
        <p id="hint" class="hint">https:// בלבד · https only</p>
        <p id="error" class="error" role="alert"></p>
        <button type="submit">שמירה והתחלה · Save and start</button>
      </form>
      <p class="hint">מקשים לאנשי תמיכה: Ctrl+Shift+Alt+S חזרה למסך זה · Ctrl+Shift+Alt+Q יציאה</p>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
