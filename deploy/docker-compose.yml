# Rubinny — single-host deployment.
#   cd deploy && ./generate-env.sh && docker compose up -d --build
name: rubinny

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  # Public entry point: Caddy with the CMS build (automatic HTTPS, security headers).
  web:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/cms/Dockerfile
    image: ${RUBINNY_IMAGES:-rubinny}/web:${RUBINNY_VERSION:-local}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      RUBINNY_DOMAIN: ${RUBINNY_DOMAIN:-localhost}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      server:
        condition: service_healthy
    networks: [edge]

  server:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: ${RUBINNY_IMAGES:-rubinny}/server:${RUBINNY_VERSION:-local}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: https://${RUBINNY_DOMAIN:-localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-rubinny}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rubinny}
      REDIS_URL: redis://valkey:6379
      # Only private (Docker network) addresses may set X-Forwarded-* headers.
      TRUST_PROXY: uniquelocal
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN in .env}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      MAX_ORGS_PER_USER: ${MAX_ORGS_PER_USER:-10}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      PLAY_RETENTION_DAYS: ${PLAY_RETENTION_DAYS:-90}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Weather widget: disabled unless set (see .env.example for licensing notes).
      WEATHER_API_URL: ${WEATHER_API_URL:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      # Free stock images (public domain/CC0) through the server; set false to disable.
      STOCK_IMAGES_ENABLED: ${STOCK_IMAGES_ENABLED:-true}
      STOCK_API_URL: ${STOCK_API_URL:-https://api.openverse.org/v1}
      # Sign-in through an OpenID Connect provider (SSO): disabled unless OIDC_ISSUER is set.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      <<: &media-env
        S3_ENDPOINT: http://storage:8333
        S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
        S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
        CLAMAV_HOST: clamav
        CLAMAV_PORT: '3310'
        MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-26214400}
        MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-536870912}
        MEDIA_ORG_QUOTA_BYTES: ${MEDIA_ORG_QUOTA_BYTES:-0}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks: [edge, backend]

  # Media pipeline: malware scan, type verification, metadata stripping, thumbnails.
  # Isolated: no internet (backend network only), read-only root, no capabilities.
  worker:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: worker
    image: ${RUBINNY_IMAGES:-rubinny}/worker:${RUBINNY_VERSION:-local}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: https://${RUBINNY_DOMAIN:-localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-rubinny}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rubinny}
      REDIS_URL: redis://valkey:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN in .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      TMPDIR: /work
      <<: *media-env
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - worker-scratch:/work
    cap_drop: [ALL]
    mem_limit: 1536m
    pids_limit: 256
    depends_on:
      server:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks: [backend]

  postgres:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rubinny}
      POSTGRES_DB: ${POSTGRES_DB:-rubinny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  valkey:
    <<: *hardening
    image: valkey/valkey:9-alpine
    # noeviction: queued jobs must never be evicted (required by BullMQ).
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--save',
        '60',
        '1000',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  storage:
    <<: *hardening
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '/rubinny/entrypoint.sh']
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./seaweedfs/entrypoint.sh:/rubinny/entrypoint.sh:ro
      - storage-data:/data
    healthcheck:
      # Healthy only when the S3 API answers too (it starts last, and later with much data).
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/healthz',
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Malware scanning for uploads (used from Phase 3). Needs ~1.5–2 GB RAM and
  # outbound access to download signature updates (freshclam).
  clamav:
    <<: *hardening
    # The default image is amd64 only. On arm64 servers set CLAMAV_IMAGE=clamav/clamav-debian:stable.
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    environment:
      # Default stream limit is 25 MB; allow scanning videos up to the upload limit.
      CLAMD_CONF_StreamMaxLength: 1024M
      CLAMD_CONF_MaxFileSize: 1024M
      CLAMD_CONF_MaxScanSize: 1024M
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [backend, egress]

networks:
  edge: {}
  # No outbound internet access for databases and storage.
  backend:
    internal: true
  egress: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  postgres-data: {}
  valkey-data: {}
  storage-data: {}
  clamav-data: {}
  worker-scratch: {}
